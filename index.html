<meta charset="utf-8">
<title>Bany OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* ============ ТЕМА (правь тут) ============ */
:root{
  --bg:#050a07;            /* фон ОС */
  --phos:#7fe08a;          /* основной зелёный */
  --phos-dim:#2f6b3a;      /* приглушённый зелёный */
  --phos-hi:#d8ffd8;       /* яркий */
  --lamp:#ff5a6e;          /* акцент из красной комнаты */
  --ink:#d9f5dc;
  --font-ui:'VT323','Courier New',monospace;
  --icon-filter:none;      /* напр. sepia(.4) hue-rotate(70deg) saturate(1.3) */
  --icon-size:96px;        /* размер иконок */
  --taskbar:46px;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--font-ui);-webkit-user-select:none;user-select:none}
button{font-family:inherit}

/* ============ ЭКРАН 1: монитор ============ */
#view{position:fixed;inset:0;overflow:hidden;background:#0b0d0c}
#paint{position:absolute;left:0;top:0;width:1024px;height:1024px;transform-origin:0 0;will-change:transform}
#paint img{display:block;width:1024px;height:1024px;max-width:none}
#glow{position:absolute;left:120px;top:150px;width:780px;height:640px;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(80,255,120,.30),rgba(80,255,120,0))}
#screen{position:absolute;left:0;top:0;width:494px;height:336px;transform-origin:0 0;image-rendering:auto;will-change:transform;background:#000;border-radius:16px}
#hint{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom,0px));text-align:center;font-size:30px;letter-spacing:.14em;
  color:var(--phos);text-shadow:0 0 8px rgba(127,224,138,.55),0 1px 0 #000;opacity:0;transition:opacity .6s;pointer-events:none}
#hint.on{opacity:1;animation:blink 1.4s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.35}}
#view.hot{cursor:pointer}
#replay{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));font-size:22px;letter-spacing:.08em;
  color:var(--phos);background:rgba(5,10,7,.55);border:1px solid var(--phos-dim);padding:0 10px;cursor:pointer;z-index:60}
#replay:hover,#replay:focus-visible{border-color:var(--phos);outline:none}

/* ============ ЭКРАН 2: ОС ============ */
#os{position:fixed;inset:0;opacity:0;pointer-events:none;background:var(--bg);overflow:hidden}
#os.on{pointer-events:auto}
#os::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(60,200,100,.10),rgba(0,0,0,0) 62%),
  repeating-linear-gradient(0deg,rgba(127,224,138,.035) 0 1px,transparent 1px 4px)}
#os::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.20) 2px 3px)}
.desk{position:absolute;inset:0 0 var(--taskbar) 0;display:grid;grid-template-columns:1fr var(--room) 1fr;align-items:center;gap:12px;
  padding:12px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;--room:min(calc(100vh - var(--taskbar) - 70px),52vw)}
.icons{display:grid;grid-template-columns:repeat(2,calc(var(--icon-size) + 16px));grid-auto-rows:calc(var(--icon-size) + 34px);gap:6px 10px;justify-content:center;align-content:center}
.icon{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px;cursor:pointer;color:var(--phos);
  font-size:20px;line-height:1;letter-spacing:0;text-shadow:0 1px 0 #000;opacity:0;transform:scale(.6)}
.icon .spr{flex:none;width:64px;height:64px;background:url(assets/icons.png) no-repeat;image-rendering:pixelated;transform:scale(1.4);transform-origin:50% 60%;
  margin:10px 0 8px;filter:var(--icon-filter)}
.icon span.l{display:block;max-width:calc(var(--icon-size) + 12px);overflow-wrap:anywhere;padding:1px 4px;word-break:break-word}
.icon:hover span.l,.icon:focus-visible span.l{background:var(--phos);color:#04100a;outline:none}
.icon.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
#roomwin{display:flex;flex-direction:column;border:2px solid var(--phos);background:#000;box-shadow:0 0 28px rgba(127,224,138,.25);opacity:0}
#roomwin .tb{display:flex;justify-content:space-between;align-items:center;background:var(--phos);color:#04100a;font-size:22px;letter-spacing:.1em;padding:0 8px;line-height:24px}
#roomwin .tb i{display:inline-block;width:8px;height:8px;background:var(--lamp);margin-right:8px;animation:blink 1.1s steps(2,jump-none) infinite}
#roomwrap{width:var(--room);height:var(--room);overflow:visible;position:relative}
#room{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;transform-origin:50% 50%;will-change:transform}
.desk.hide-ui #roomwin{opacity:1}

/* панель задач */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--taskbar);box-sizing:border-box;background:#06120b;border-top:2px solid var(--phos);
  display:flex;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-left,0px));font-size:24px;z-index:20;transform:translateY(100%)}
#taskbar.up{transform:none;transition:transform .5s}
#start{background:var(--phos);color:#04100a;border:0;padding:0 12px;font-size:24px;letter-spacing:.1em;cursor:pointer;line-height:30px}
#tasks{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.task{border:1px solid var(--phos-dim);background:none;color:var(--phos);font-size:20px;padding:0 10px;cursor:pointer;white-space:nowrap;line-height:26px}
.task.act{background:var(--phos-dim);color:var(--phos-hi)}
#clock{color:var(--phos);letter-spacing:.1em}
#exit{background:none;border:1px solid var(--phos-dim);color:var(--phos);font-size:20px;padding:0 10px;cursor:pointer;line-height:26px}
#exit:hover{border-color:var(--phos)}

/* окна */
#wins{position:absolute;inset:0 0 var(--taskbar) 0;pointer-events:none;z-index:10}
.win{position:absolute;pointer-events:auto;border:2px solid var(--phos);background:#000;box-shadow:6px 6px 0 rgba(0,0,0,.55),0 0 22px rgba(127,224,138,.18);max-width:94vw}
.win .tb{display:flex;justify-content:space-between;align-items:center;background:var(--phos);color:#04100a;font-size:22px;letter-spacing:.08em;padding:0 4px 0 8px;line-height:24px;cursor:move;touch-action:none}
.win .x{background:#04100a;color:var(--phos);border:0;width:22px;height:20px;line-height:18px;font-size:20px;cursor:pointer;padding:0}
.win .x:hover{background:var(--lamp);color:#fff}
.win img{display:block;max-width:100%;height:auto;max-height:calc(100vh - var(--taskbar) - 70px);width:100%;object-fit:contain}
.win .empty{padding:26px 34px;color:var(--phos);font-size:26px;letter-spacing:.08em}

@media (max-aspect-ratio:1/1){
  .desk{grid-template-columns:1fr;grid-template-rows:auto var(--room) auto;align-content:center;--room:min(calc(100vw - 32px),calc(100vh - var(--taskbar) - 330px));justify-items:center;gap:6px}
  .icons{grid-template-columns:repeat(4,80px);grid-auto-rows:92px;--icon-size:78px;gap:0 4px}
  .icon .spr{transform:scale(1);margin:2px 0 2px}
  .icon{font-size:16px;padding:0}
  .icon span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px}
}
</style>

<div id="view">
  <div id="paint">
    <img id="img" src="assets/monitor.jpg" alt="Ретро-компьютер с зелёным экраном" draggable="false">
    <div id="glow"></div>
  </div>
  <canvas id="screen" width="494" height="336"></canvas>
</div>
<div id="hint">&gt; НАЖМИ НА ЭКРАН_</div>

<div id="os">
  <div class="desk" id="desk">
    <div class="icons" id="iconsL"></div>
    <div id="roomwin">
      <div class="tb"><span><i></i>BANY.EXE</span><span>я тут</span></div>
      <div id="roomwrap"><canvas id="room" width="1024" height="1024"></canvas></div>
    </div>
    <div class="icons" id="iconsR"></div>
  </div>
  <div id="wins"></div>
  <div id="taskbar"><button id="start" type="button">БАНИ_ОС</button><div id="tasks"></div><span id="clock">--:--</span><button id="exit" type="button">ВЫЙТИ</button></div>
</div>
<button id="replay" type="button">ЗАНОВО</button>

<script>
(function(){
/* =====================================================================
   НАСТРОЙКИ — всё, что захочешь поменять, лежит тут
   ===================================================================== */
var CONFIG={
  rainMs:3300,          // сколько сыплется код на мониторе
  diveMs:1900,          // падение камеры в экран
  zoomOutMs:1700,       // отъезд внутри ОС до полной комнаты
  roomFps:12,           // частота кадров анимации экранов в комнате
  screenCrop:{x:0,y:170,w:1024,h:696},   // какую часть комнаты видно на мониторе (в пикселях картинки 1024x1024)
  monitorGlass:[[260,300],[750,300],[750,632],[260,632]], // стекло монитора на monitor.jpg: ЛВ, ПВ, ПН, ЛН
  focus:[505,470],      // куда смотрит камера на первом экране
  zoom:1.12             // зум первого экрана (1 = картинка «cover»)
};

/* Иконки ОС. spr = [колонка, строка] в assets/icons.png (ячейки 64x64).
   win = ключ из WINDOWS (какое окно открыть), side = left | right */
var ICONS=[
  {l:'ПРОЕКТЫ',   spr:[3,6], side:'left'},
  {l:'ВИДЕО',     spr:[6,6], side:'left'},
  {l:'ПРОМПТЫ',   spr:[5,6], side:'left'},
  {l:'ШОРТС',     spr:[7,6], side:'left'},
  {l:'ЗАГРУЗКИ',  spr:[4,6], side:'left',  win:'download'},
  {l:'HELLO_WORLD',spr:[0,7],side:'left',  win:'hello'},
  {l:'ЧЕРНОВИКИ', spr:[2,7], side:'left'},
  {l:'АРХИВ',     spr:[4,7], side:'left'},

  {l:'ТЕРМИНАЛ',  spr:[3,0], side:'right', win:'terminal'},
  {l:'КОРЗИНА',   spr:[6,0], side:'right', win:'rat'},
  {l:'ПОЧТА',     spr:[6,4], side:'right'},
  {l:'КАМЕРА',    spr:[3,10],side:'right', win:'photo'},
  {l:'СИНТЕЗАТОР',spr:[6,5], side:'right', win:'register'},
  {l:'ИНТЕРНЕТ',  spr:[7,5], side:'right'},
  {l:'ВИРУС.EXE', spr:[3,4], side:'right', win:'virus'},
  {l:'КАЛЕНДАРЬ', spr:[4,10],side:'right'}
];

/* Окна. w — ширина в px (на узком экране сожмётся). Без src — пустое окно с текстом. */
var WINDOWS={
  terminal:{title:'WORD PROCESSOR',src:'assets/terminal.jpg',w:560},
  rat:     {title:'404.EXE',       src:'assets/rat404.jpg',  w:460},
  virus:   {title:'SHUTDOWN.EXE',  src:'assets/virus.jpg',   w:560},
  register:{title:'REGISTER CONTROL',src:'assets/register.jpg',w:430},
  download:{title:'ЗАГРУЗКИ',      src:'assets/download.jpg',w:430},
  hello:   {title:'HELLO_WORLD',   src:'assets/hello.jpg',   w:400},
  photo:   {title:'КАМЕРА — IMG_0001',src:'assets/room.png',w:460}
};

/* Комната: экраны, которые оживают. rect = [x,y,w,h] в пикселях room.png (1024x1024) */
var SCREENS={
  red:   [20,80,210,148],
  top:   [364,102,124,76],
  blinds:[300,20,540,395],
  main:  [300,376,368,206],
  right: [796,546,156,80]
};

/* ===================================================================== */
var PW=1024, RS=1024;
var $=function(i){return document.getElementById(i)};
var view=$('view'),paint=$('paint'),screenC=$('screen'),sctx=screenC.getContext('2d'),hint=$('hint'),glow=$('glow'),img=$('img');
var os=$('os'),desk=$('desk'),roomC=$('room'),rctx=roomC.getContext('2d'),taskbar=$('taskbar');
var SW=screenC.width, SH=screenC.height;
var CROP=CONFIG.screenCrop;

/* ---------------- иконки ---------------- */
function mkIcon(ic){
  var b=document.createElement('button');b.type='button';b.className='icon';
  b.innerHTML='<div class="spr" style="background-position:'+(-ic.spr[0]*64)+'px '+(-ic.spr[1]*64)+'px"></div><span class="l"></span>';
  b.querySelector('.l').textContent=ic.l;
  b.addEventListener('click',function(){openWin(ic.win||('empty:'+ic.l))});
  return b}
var iconEls=[];
ICONS.forEach(function(ic){var el=mkIcon(ic);iconEls.push(el);$(ic.side==='left'?'iconsL':'iconsR').appendChild(el)});

/* ---------------- окна ---------------- */
var wins=$('wins'),tasks=$('tasks'),zTop=10,openN=0,wmap={};
function focusWin(w){zTop++;w.style.zIndex=zTop;Object.keys(wmap).forEach(function(k){wmap[k].t.classList.toggle('act',wmap[k].w===w)})}
function openWin(key){
  if(wmap[key]){focusWin(wmap[key].w);return}
  var cfg,isEmpty=key.indexOf('empty:')===0;
  cfg=isEmpty?{title:key.slice(6),w:340}:WINDOWS[key];
  var w=document.createElement('div');w.className='win';w.style.width=Math.min(cfg.w,innerWidth*0.94)+'px';
  var off=(openN++%6)*28;
  w.style.left=Math.max(8,Math.min(innerWidth-cfg.w-8,innerWidth/2-cfg.w/2+off-60))+'px';w.style.top=(30+off)+'px';
  w.innerHTML='<div class="tb"><span></span><button class="x" type="button" aria-label="Закрыть">×</button></div>'+(isEmpty?'<div class="empty">[ПАПКА ПУСТА]</div>':'<img alt="" draggable="false">');
  w.querySelector('.tb span').textContent=cfg.title;
  if(!isEmpty)w.querySelector('img').src=cfg.src;
  wins.appendChild(w);
  var t=document.createElement('button');t.type='button';t.className='task';t.textContent=cfg.title;tasks.appendChild(t);
  wmap[key]={w:w,t:t};
  t.addEventListener('click',function(){focusWin(w)});
  w.addEventListener('pointerdown',function(){focusWin(w)});
  w.querySelector('.x').addEventListener('click',function(e){e.stopPropagation();w.remove();t.remove();delete wmap[key]});
  var tb=w.querySelector('.tb'),dx,dy,drag=false;
  tb.addEventListener('pointerdown',function(e){if(e.target.className==='x')return;drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;tb.setPointerCapture(e.pointerId)});
  tb.addEventListener('pointermove',function(e){if(!drag)return;w.style.left=Math.max(-w.offsetWidth+60,Math.min(innerWidth-60,e.clientX-dx))+'px';w.style.top=Math.max(0,e.clientY-dy)+'px'});
  tb.addEventListener('pointerup',function(){drag=false});
  focusWin(w)}
function closeAllWins(){Object.keys(wmap).forEach(function(k){wmap[k].w.remove();wmap[k].t.remove();delete wmap[k]})}
function tickClock(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
setInterval(tickClock,10000);tickClock();

/* ---------------- 3x5 шрифт ---------------- */
var FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
'5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
'A':'111101111101101','B':'110101110101110','C':'111100100100111','D':'110101101101110','E':'111100110100111','F':'111100110100100',
'<':'001010100010001','>':'100010001010100','/':'001001010100100','=':'000111000111000','{':'011010110010011','}':'110010011010110',
';':'000010000010100','_':'000000000000111','#':'101111101111101'};
var CH='0123456789ABCDEF<>/={};_#0123456789ABCDEF';
function glyph(ctx,ch,x,y,col,sc){var g=FONT[ch];if(!g)return;ctx.fillStyle=col;
 for(var r=0;r<5;r++)for(var q=0;q<3;q++)if(g.charAt(r*3+q)==='1')ctx.fillRect(x+q*sc,y+r*sc,sc,sc)}
function rnd(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* ---------------- комната: оживающие экраны ---------------- */
var baseData=null,frame=null,roomReady=false;
var masks={},ledGroups=[];
var tmp={};
function mkTmp(k){var r=SCREENS[k],c=document.createElement('canvas');c.width=r[2];c.height=r[3];tmp[k]={c:c,x:c.getContext('2d'),w:r[2],h:r[3]}}
Object.keys(SCREENS).forEach(mkTmp);
var rimg=new Image();
rimg.onload=function(){
 var bc=document.createElement('canvas');bc.width=RS;bc.height=RS;var bx=bc.getContext('2d');bx.drawImage(rimg,0,0);
 var id=bx.getImageData(0,0,RS,RS);baseData=id.data;frame=rctx.createImageData(RS,RS);
 buildMasks();roomReady=true};
rimg.src='assets/room.png';
function buildMasks(){
 var d=baseData;
 function collect(k,test){var r=SCREENS[k],a=[];for(var y=r[1];y<r[1]+r[3];y++)for(var x=r[0];x<r[0]+r[2];x++){var i=(y*RS+x)*4;if(test(d[i],d[i+1],d[i+2]))a.push(y*RS+x)}return new Uint32Array(a)}
 masks.red=collect('red',function(r,g,b){return r>120});
 masks.top=collect('top',function(){return true});
 masks.right=collect('right',function(){return true});
 masks.main=collect('main',function(r,g,b){return g>135&&b>135&&g>r+4});
 masks.blinds=collect('blinds',function(r,g,b){return b>r+8&&(b>85||g>85)});
 // светодиоды на стойках
 var regs=[[30,280,230,400],[40,470,230,200],[770,500,190,240]],seen={};
 regs.forEach(function(R){for(var y=R[1];y<R[1]+R[3];y++)for(var x=R[0];x<R[0]+R[2];x++){var i=(y*RS+x)*4,r=d[i],g=d[i+1],b=d[i+2];
  var yel=r>200&&g>170&&b<130,grn=g>170&&r<170&&b<150,cy=b>170&&g>150&&r<130,or=r>220&&g>100&&g<175&&b<90;
  if(yel||grn||cy||or){var key=(x>>2)+','+(y>>2);if(!seen[key])seen[key]={px:[],ph:rnd(x*3+y)*6.28,sp:.8+rnd(y*7+x)*3.2};seen[key].px.push(y*RS+x)}}});
 Object.keys(seen).forEach(function(k){ledGroups.push(seen[k])})}

var COL={g:'#7fe08a',gd:'#3a8a4a',gh:'#d8ffd8'};
function drawMain(t,st){var T=tmp.main,c=T.x,w=T.w,h=T.h,sc=2,GW=4*sc,GH=6*sc;
 c.fillStyle='#03100a';c.fillRect(0,0,w,h);
 var rowsN=Math.floor(h/GH)-1,line0=Math.floor(st/4);
 for(var i=0;i<rowsN;i++){var n=line0+i,y=h-GH*(i+2);
  var ind=Math.floor(rnd(n*5+1)*4),len=4+Math.floor(rnd(n*7+2)*34),hi=rnd(n*11+3)>.9;
  for(var k=0;k<len;k++){var sp=rnd(n*131+k)>.84;if(sp)continue;
   var ch=CH.charAt(Math.floor(rnd(n*17+k*3)*CH.length));
   glyph(c,ch,2+(ind+k)*GW,y+1,hi?COL.gh:(k<3?COL.g:COL.gd),sc)}}
 var py=h-GH-2;glyph(c,'>',2,py,COL.g,sc);if(Math.floor(st/6)%2===0){c.fillStyle=COL.g;c.fillRect(2+GW*2,py,GW-2,GH-2)}
 c.fillStyle='rgba(0,0,0,.28)';for(var y=0;y<h;y+=2)c.fillRect(0,y,w,1)}
function drawRed(t,st){var T=tmp.red,c=T.x,w=T.w,h=T.h;
 c.fillStyle='#32091a';c.fillRect(0,0,w,h);var s=Math.floor(st/3),bar=14;
 for(var i=0;i<12;i++){var n=s+i,y=((i*bar-(st%3)*0)+h)%h;var wd=24+rnd(n*3+i)*(w-70),x0=10+rnd(n*5)*22;
  c.fillStyle=rnd(n*7)>.82?'#ffe8ee':(rnd(n*9)>.5?'#ff7d92':'#b02c4a');c.fillRect(x0,(i*bar+h-(s%12)*bar+h)%h,wd,4)}
 var by=(st*3)%(h+30)-15;c.fillStyle='rgba(255,170,190,.22)';c.fillRect(0,by,w,10);
 c.fillStyle='rgba(0,0,0,.25)';for(var y=0;y<h;y+=3)c.fillRect(0,y,w,1)}
function drawTop(t,st){var T=tmp.top,c=T.x,w=T.w,h=T.h;
 c.fillStyle='#09121c';c.fillRect(0,0,w,h);var s=Math.floor(st/2),cols=['#e8923a','#d04a4a','#4ab8d8','#d6c24a'];
 for(var i=0;i<9;i++){var bh=6+rnd(i*9+s*13)*(h-30);c.fillStyle=cols[i%4];c.fillRect(8+i*12,h-8-bh,8,bh)}
 for(var j=0;j<14;j++){c.fillStyle=rnd(j*7+s)>.5?'#6fe0a0':'#1d3a34';c.fillRect(6+j*8,4,4,4)}
 c.fillStyle='#4ab8d8';var py=h/2;for(var x=0;x<w;x+=3){var yy=6+Math.sin((x+st*3)/9)*3;c.fillRect(x,Math.round(yy+3),2,1)}}
function drawRight(t,st){var T=tmp.right,c=T.x,w=T.w,h=T.h;
 c.fillStyle='#04070b';c.fillRect(0,0,w,h);var cols=['#e8d04a','#6fe0a0','#4ab8d8','#e05050','#c8d0d8'],line0=Math.floor(st/3);
 for(var i=0;i<Math.floor(h/7);i++){var n=line0+i,y=h-7*(i+1),x=4+Math.floor(rnd(n*3)*3)*6;
  for(var k=0;k<5;k++){var wd=4+Math.floor(rnd(n*13+k)*26);c.fillStyle=cols[Math.floor(rnd(n*19+k*5)*cols.length)];c.fillRect(x,y,wd,3);x+=wd+4;if(x>w-8)break}}}
function paintInto(k,fn,t,st){fn(t,st);var T=tmp[k],r=SCREENS[k],id=T.x.getImageData(0,0,T.w,T.h).data,m=masks[k],o=frame.data;
 for(var j=0;j<m.length;j++){var p=m[j],x=(p%RS)-r[0],y=((p/RS)|0)-r[1],s=(y*T.w+x)*4,q=p*4;o[q]=id[s];o[q+1]=id[s+1];o[q+2]=id[s+2]}}
function drawBlinds(t,st){var m=masks.blinds,o=frame.data,d=baseData,band=((t*90)%(540+240))-120;
 for(var j=0;j<m.length;j++){var p=m[j],x=p%RS,y=(p/RS)|0,q=p*4;
  var f=.45+.75*rnd((x>>3)*31+(y>>2)*17+Math.floor(st/3)*7);
  var bb=Math.max(0,1-Math.abs((x-300)-band)/70)*0.9;
  var k=Math.min(2.2,f+bb);o[q]=Math.min(255,d[q]*k);o[q+1]=Math.min(255,d[q+1]*k);o[q+2]=Math.min(255,d[q+2]*k)}}
function renderRoom(t){
 if(!roomReady)return false;
 var st=Math.floor(t*CONFIG.roomFps);frame.data.set(baseData);
 paintInto('main',drawMain,t,st);paintInto('red',drawRed,t,st);paintInto('top',drawTop,t,st);paintInto('right',drawRight,t,st);
 drawBlinds(t,st);
 var o=frame.data,d=baseData;
 for(var g=0;g<ledGroups.length;g++){var L=ledGroups[g],on=Math.sin(t*L.sp+L.ph)>-0.25,kk=on?1:.28;
  for(var j=0;j<L.px.length;j++){var q=L.px[j]*4;o[q]=d[q]*kk;o[q+1]=d[q+1]*kk;o[q+2]=d[q+2]*kk}}
 rctx.putImageData(frame,0,0);return true}

/* ---------------- гомография ---------------- */
function solve(A,b){var n=b.length,i,j,k;for(i=0;i<n;i++){var m=i;for(j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;
 var t=A[i];A[i]=A[m];A[m]=t;var tb=b[i];b[i]=b[m];b[m]=tb;
 for(j=i+1;j<n;j++){var f=A[j][i]/A[i][i];for(k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}
 var x=new Array(n);for(i=n-1;i>=0;i--){var s=b[i];for(j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i]}return x}
function matrixFor(q){var src=[[0,0],[SW,0],[SW,SH],[0,SH]],A=[],b=[];
 for(var i=0;i<4;i++){var x=src[i][0],y=src[i][1],X=q[i][0],Y=q[i][1];
  A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y)}
 var h=solve(A,b);return 'matrix3d('+[h[0],h[3],0,h[6],h[1],h[4],0,h[7],0,0,1,0,h[2],h[5],0,1].join(',')+')'}

/* ---------------- камера первого экрана ---------------- */
var Q0=CONFIG.monitorGlass;
var vw,vh,k0,ox0,oy0,Qv0,Qend,curQ;
function layout(){
 vw=innerWidth;vh=innerHeight;
 k0=Math.max(vw/PW,vh/PW)*CONFIG.zoom;var f=CONFIG.focus;
 ox0=Math.min(0,Math.max(vw-PW*k0,vw/2-f[0]*k0));oy0=Math.min(0,Math.max(vh-PW*k0,vh/2-f[1]*k0));
 Qv0=Q0.map(function(p){return [p[0]*k0+ox0,p[1]*k0+oy0]});
 var s=Math.max(vw/SW,vh/SH),w=SW*s,h=SH*s,x=(vw-w)/2,y=(vh-h)/2;
 Qend=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
 applyOuter()}
addEventListener('resize',function(){layout();if(state==='inside')prepOS(1)});
function sstep(x){x=Math.min(1,Math.max(0,x));return x*x*x*(x*(6*x-15)+10)}
var dive=0;
function applyOuter(){
 var e=sstep(dive);
 var Q=Qv0.map(function(p,i){return [p[0]+(Qend[i][0]-p[0])*e,p[1]+(Qend[i][1]-p[1])*e]});curQ=Q;
 var w0=Qv0[1][0]-Qv0[0][0],w1=Q[1][0]-Q[0][0],k=k0*(w1/w0);
 var pc=[(Q0[0][0]+Q0[1][0]+Q0[2][0]+Q0[3][0])/4,(Q0[0][1]+Q0[1][1]+Q0[2][1]+Q0[3][1])/4];
 var qc=[(Q[0][0]+Q[1][0]+Q[2][0]+Q[3][0])/4,(Q[0][1]+Q[1][1]+Q[2][1]+Q[3][1])/4];
 paint.style.transform='translate('+(qc[0]-pc[0]*k)+'px,'+(qc[1]-pc[1]*k)+'px) scale('+k+')';
 screenC.style.transform=matrixFor(Q)}

/* ---------------- переход в ОС ---------------- */
var osE=0; // 0 = комната во весь экран (как видно с монитора), 1 = рабочий стол
function prepOS(e){
 osE=e;var wrap=$('roomwrap');
 // сбросить трансформ, чтобы взять итоговый прямоугольник
 roomC.style.transform='none';var R=wrap.getBoundingClientRect(),sf=R.width/RS;
 var s=Math.max(vw/SW,vh/SH),f=CROP.w/SW;
 var visW=vw/s*f; // ширина видимой части в px комнаты
 var cxr=CROP.x+CROP.w/2,cyr=CROP.y+CROP.h/2;
 var m=vw/(visW*sf);
 var O=[R.left+R.width/2,R.top+R.height/2],cs=[R.left+cxr*sf,R.top+cyr*sf];
 var tx=vw/2-O[0]-m*(cs[0]-O[0]),ty=vh/2-O[1]-m*(cs[1]-O[1]);
 var ee=sstep(e),sc=Math.pow(m,1-ee);
 roomC.style.transform='translate('+(tx*(1-ee))+'px,'+(ty*(1-ee))+'px) scale('+sc+')';
 // чтобы комната при увеличении была поверх всего
 wrap.style.zIndex=e<1?30:'auto';
 $('roomwin').style.opacity=e<1?(ee>0.35?(ee-0.35)/0.65:0):1;
 $('roomwin').style.borderColor=ee>0.5?'':'transparent';
 os.style.opacity=Math.min(1,e*9+ (e>0?0:0));
 var show=ee>0.55;iconEls.forEach(function(el,i){if(show&&!el.classList.contains('pop')){setTimeout(function(){el.classList.add('pop')},i*55)}});
 if(e<=0.001){iconEls.forEach(function(el){el.classList.remove('pop')})}
 taskbar.classList.toggle('up',ee>0.8)}

/* ---------------- код-дождь на экране монитора ---------------- */
var GS=2,GW=4*GS,GH=6*GS,rows=Math.floor(SH/GH),cols=Math.floor(SW/GW);
var GL=['#d8ffd8','#7fe08a','#4e9458','#376f3f','#27502e'];
var colInfo=[];for(var c=0;c<cols;c++)colInfo.push({d:rnd(c)*1100,v:75+rnd(c+99)*110,L:60+rnd(c+7)*200});
var rain=document.createElement('canvas');rain.width=SW;rain.height=SH;var xctx=rain.getContext('2d');
function drawRain(t){xctx.fillStyle='#030a05';xctx.fillRect(0,0,SW,SH);
 for(var c=0;c<cols;c++){var ci=colInfo[c];var head=(t-ci.d)*ci.v/1000;if(head<0)continue;
  for(var r=0;r<rows;r++){var y=r*GH,dist=head-y;if(dist<0)continue;
   var lim=t<CONFIG.rainMs?ci.L:ci.L*4;if(dist>lim+SH)continue;
   var lv=dist<GH?0:Math.min(4,1+Math.floor((dist-GH)/Math.max(34,lim/3.2)));if(dist>lim)lv=4;
   var ch=CH.charAt(Math.floor(rnd(c*31+r*7+Math.floor(t/(dist<GH*3?60:380)))*CH.length));
   glyph(xctx,ch,c*GW+1,y+1,GL[lv],GS)}}}
function scanlines(ctx){ctx.fillStyle='rgba(0,0,0,.2)';for(var y=0;y<SH;y+=3)ctx.fillRect(0,y,SW,1)}

/* ---------------- состояния ---------------- */
var T0=performance.now(),state='rain',diveDir=0,prev=T0,osDir=0;
function reset(){T0=performance.now();state='rain';dive=0;diveDir=0;osE=0;osDir=0;hint.classList.remove('on');view.classList.remove('hot');
 closeAllWins();view.style.visibility='visible';os.style.opacity=0;os.classList.remove('on');taskbar.classList.remove('up');
 iconEls.forEach(function(el){el.classList.remove('pop')});applyOuter()}
function startDive(){if(state!=='ready')return;state='diving';diveDir=1;hint.classList.remove('on');view.classList.remove('hot')}
function startBack(){if(state!=='inside')return;state='osout';osDir=-1;closeAllWins()}
function inQuad(x,y){var q=curQ;if(!q)return false;var s=0;
 for(var i=0;i<4;i++){var a=q[i],b=q[(i+1)%4],cr=(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);if(i===0)s=cr>0?1:-1;else if((cr>0?1:-1)!==s)return false}return true}
view.addEventListener('pointerdown',function(e){if(state==='ready'&&inQuad(e.clientX,e.clientY))startDive()});
view.addEventListener('pointermove',function(e){view.classList.toggle('hot',state==='ready'&&inQuad(e.clientX,e.clientY))});
addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&state==='ready'){e.preventDefault();startDive()}else if(e.key==='Escape')startBack()});
$('exit').addEventListener('click',startBack);$('start').addEventListener('click',function(){openWin('terminal')});
$('replay').addEventListener('click',reset);

/* ---------------- главный цикл ---------------- */
function drawScreen(el,t){
 var crop=function(){sctx.imageSmoothingEnabled=true;sctx.drawImage(roomC,CROP.x,CROP.y,CROP.w,CROP.h,0,0,SW,SH);scanlines(sctx)};
 if(state==='rain'){
  drawRain(el);sctx.clearRect(0,0,SW,SH);
  var R=CONFIG.rainMs;
  if(el<R)sctx.drawImage(rain,0,0);
  else if(el<R+260){var u=(el-R)/260,h=Math.max(2,SH*(1-u)*(1-u));sctx.fillStyle='#000';sctx.fillRect(0,0,SW,SH);sctx.drawImage(rain,0,0,SW,SH,0,(SH-h)/2,SW,h)}
  else if(el<R+420){sctx.fillStyle='#000';sctx.fillRect(0,0,SW,SH);sctx.fillStyle='#d7ffd9';sctx.fillRect(0,SH/2-2,SW,4)}
  else if(el<R+1000){var u2=(el-R-420)/580,h2=Math.max(4,SH*(1-(1-u2)*(1-u2)));
   sctx.fillStyle='#000';sctx.fillRect(0,0,SW,SH);
   var sy=CROP.y+(CROP.h-CROP.h*h2/SH)/2,sh=CROP.h*h2/SH;
   sctx.drawImage(roomC,CROP.x,sy,CROP.w,sh,0,(SH-h2)/2,SW,h2);scanlines(sctx);
   sctx.fillStyle='#d7ffd9';sctx.fillRect(0,Math.floor((SH-h2)/2),SW,1);sctx.fillRect(0,Math.floor((SH+h2)/2)-1,SW,1)}
  else{state='ready';hint.classList.add('on')}
  glow.style.opacity=.55+.2*Math.sin(el/90)*Math.sin(el/310);
 }else if(state==='ready'||state==='diving'||state==='surf'){crop();glow.style.opacity=.65}}
function tick(now){
 var dt=Math.min(100,now-prev);prev=now;var el=now-T0,t=now/1000;
 renderRoom(t);
 if(state!=='inside'&&state!=='osout'&&state!=='osin')drawScreen(el,t);
 if(state==='diving'){dive+=dt/CONFIG.diveMs;if(dive>=1){dive=1;state='osin';osE=0;os.classList.add('on');prepOS(0.0001)}applyOuter()}
 if(state==='osin'){osE+=dt/CONFIG.zoomOutMs;if(osE>=1){osE=1;state='inside'}prepOS(osE);if(osE>0.15)view.style.visibility='hidden'}
 if(state==='osout'){osE-=dt/CONFIG.zoomOutMs;view.style.visibility='visible';
  if(osE<=0){osE=0;state='diving';diveDir=-1;os.classList.remove('on');os.style.opacity=0;taskbar.classList.remove('up');dive=1;state='surf'}
  else prepOS(osE)}
 if(state==='surf'){dive-=dt/CONFIG.diveMs;if(dive<=0){dive=0;state='ready';hint.classList.add('on')}applyOuter();drawScreen(el,t)}
 requestAnimationFrame(tick)}
layout();requestAnimationFrame(tick);
})();
</script>
