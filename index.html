<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BANY OS — Никита Баннов</title>
<meta name="description" content="Никита Баннов, QA-инженер. Интерактивная визитка в стиле ретро-ОС.">
<meta name="theme-color" content="#050a07">
<link rel="preload" href="assets/fonts/press-start-2p-cyrillic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/pixelify-sans-cyrillic-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* =====================================================================
   ШРИФТЫ (лежат локально в assets/fonts, лицензия SIL OFL 1.1)
   Press Start 2P — заголовки, панель задач, подписи. Чётко выглядит на размерах, кратных 8px.
   Pixelify Sans  — основной текст в окнах.
   ===================================================================== */
@font-face{font-family:'Press Start 2P';src:url(assets/fonts/press-start-2p-cyrillic-400.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;font-display:swap}
@font-face{font-family:'Press Start 2P';src:url(assets/fonts/press-start-2p-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'Pixelify Sans';src:url(assets/fonts/pixelify-sans-cyrillic-400.woff2) format('woff2');font-weight:400 700;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;font-display:swap}
@font-face{font-family:'Pixelify Sans';src:url(assets/fonts/pixelify-sans-latin-400.woff2) format('woff2');font-weight:400 700;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}

/* Цвета задаются в CONFIG.colors (в скрипте ниже) и подставляются сюда автоматически */
:root{
  --bg:#050a07; --panel:#0b1a10; --dim:#1d5a2a; --mid:#2f8a3e; --phos:#7fe08a; --hi:#c8ffc8;
  --accent:#ff3b5c; --accent-dim:#4a0f1c; --black:#000;
  --title:'Press Start 2P',monospace; --body:'Pixelify Sans','Press Start 2P',monospace;
  --tb:40px;           /* высота панели задач */
  --t8:16px;           /* «крупный» размер Press Start 2P (кратно 8) */
  --t8s:8px;           /* мелкий размер Press Start 2P */
  --txt:18px;          /* основной текст */
  --ico:64px;          /* размер иконки — пересчитывается в JS под целый масштаб пикселей */
  --room:512px;        /* размер окна комнаты — пересчитывается в JS */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--phos);overflow:hidden}
body{font-family:var(--body);font-size:var(--txt);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:none;font-smooth:never}
button{font:inherit;color:inherit;border-radius:0}
a{color:var(--hi)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
[hidden]{display:none!important}

/* ============ ЭКРАН 1: монитор в комнате ============ */
#scene{position:fixed;inset:0;overflow:hidden;background:var(--black)}
/* фон за пределами фото — та же картинка, размытая: на любых пропорциях экрана фото не обрезается */
#backdrop{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) brightness(.32) saturate(.8);pointer-events:none}
#crt{position:absolute;left:0;top:0;transform-origin:0 0;background:#020503;will-change:transform}
#paint{position:absolute;left:0;top:0;width:1024px;height:1024px;transform-origin:0 0;will-change:transform;pointer-events:none}
#paint img{display:block;width:1024px;height:1024px;max-width:none}
#glow{position:absolute;pointer-events:none;mix-blend-mode:screen;opacity:.0;
  background:radial-gradient(closest-side,rgba(110,255,140,.28),rgba(110,255,140,0))}
#scene.hot{cursor:pointer}
#hint{position:fixed;left:16px;right:16px;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;font:var(--t8)/1.6 var(--title);color:var(--phos);
  text-shadow:0 0 6px rgba(127,224,138,.6),2px 2px 0 #000;opacity:0;pointer-events:none}
#hint.on{opacity:1;animation:blink 1.2s steps(1) infinite;pointer-events:auto;cursor:pointer;z-index:5}
#hint b{color:var(--accent);font-weight:400}
@keyframes blink{50%{opacity:.25}}
.corner{position:fixed;top:max(12px,env(safe-area-inset-top));z-index:70;display:flex;gap:8px}
.corner.r{right:max(12px,env(safe-area-inset-right))}
.chip{font:var(--t8s)/1 var(--title);background:var(--bg);color:var(--phos);border:2px solid var(--dim);padding:6px 8px;cursor:pointer}
.chip:hover{border-color:var(--phos)}

/* ============ ЭКРАН 2: ОС ============ */
#os{position:fixed;inset:0;background:var(--bg);overflow:hidden;visibility:hidden}
#os.on{visibility:visible}
/* скан-линии и лёгкое мерцание поверх всего */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 2px 3px)}
#fx.flick{animation:flick 4s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.85}48%{opacity:1}}
#desk{position:absolute;left:0;right:0;top:0;bottom:var(--tb);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;gap:16px;
  padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.icons{display:grid;grid-template-columns:repeat(2,calc(var(--ico) + 40px));gap:12px 8px;justify-content:center;align-content:center}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--phos);visibility:hidden}
.icon .ico{width:var(--ico);height:var(--ico);background:url(assets/icons.png) no-repeat;background-size:calc(var(--ico) * 12) var(--ico)}
.icon .lb{font:var(--t8s)/1.5 var(--title);padding:2px 4px;max-width:calc(var(--ico) + 40px);overflow-wrap:anywhere;text-align:center;text-shadow:1px 1px 0 #000}
.icon:hover .lb,.icon:focus-visible .lb,.icon.sel .lb{background:var(--phos);color:var(--bg);text-shadow:none}
.icon:focus-visible{outline:none}
.icon.show{visibility:visible;animation:pop .3s steps(3) both}
@keyframes pop{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}

#roomwin{position:relative;z-index:30;display:flex;flex-direction:column}
#roomwin .tbar{transition:none}
#roomwrap{position:relative;width:var(--room);height:var(--room);background:#000}
#room{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;will-change:transform}
#roomwin.frame{border:2px solid var(--phos);background:#000;box-shadow:4px 4px 0 #000}
#roomwin:not(.frame){border:2px solid transparent}
#roomwin:not(.frame) .tbar{visibility:hidden}

/* окна */
.tbar{display:flex;align-items:center;gap:8px;background:var(--phos);color:var(--bg);font:var(--t8s)/1 var(--title);height:24px;padding:0 4px 0 8px;letter-spacing:0}
.tbar .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:1px}
.tbar .dot{width:8px;height:8px;background:var(--accent);flex:none}
.tbar .dot.blink{animation:blink 1s steps(1) infinite}
#wins{position:absolute;left:0;right:0;top:0;bottom:var(--tb);pointer-events:none;z-index:40}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;border:2px solid var(--phos);background:var(--bg);box-shadow:6px 6px 0 #000;max-width:calc(100vw - 16px)}
.win.inactive{border-color:var(--mid)}
.win.inactive .tbar{background:var(--mid)}
.win .tbar{cursor:move;touch-action:none}
.win .x{flex:none;width:18px;height:16px;padding:0;border:2px solid var(--bg);background:var(--phos);color:var(--bg);font:8px/1 var(--title);cursor:pointer;display:grid;place-items:center}
.win .x:hover{background:var(--accent);color:#fff}
.win .body{overflow:auto;padding:16px;line-height:1.35;-webkit-user-select:text;user-select:text;scrollbar-color:var(--phos) var(--panel)}
.win .body.flush{padding:0;line-height:0}
.win .body img{display:block;width:100%;height:auto}
.win h2{font:var(--t8)/1.4 var(--title);margin:0 0 8px;color:var(--hi)}
.win h3{font:var(--t8s)/1.4 var(--title);margin:16px 0 8px;color:var(--phos)}
.win p{margin:0 0 12px}
.win .muted{color:var(--mid)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{border:2px solid var(--dim);padding:0 6px;color:var(--hi)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:2px dotted var(--dim)}
.rows li b{font-weight:400;color:var(--hi);min-width:7em}
.rows a{color:var(--hi)}
.btn{display:inline-block;font:var(--t8s)/1 var(--title);background:var(--bg);color:var(--phos);border:2px solid var(--phos);padding:8px 10px;cursor:pointer;text-decoration:none;margin:4px 8px 4px 0}
.btn:hover,.btn:focus-visible{background:var(--phos);color:var(--bg)}
.btn.red{border-color:var(--accent);color:var(--accent)}
.btn.red:hover{background:var(--accent);color:#fff}
.about{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.about canvas{width:96px;height:96px;border:2px solid var(--phos);flex:none;filter:grayscale(1) sepia(1) hue-rotate(65deg) saturate(2.4) brightness(.95) contrast(1.15)}
.addr{display:flex;gap:8px;align-items:center;border:2px solid var(--dim);padding:4px 8px;margin-bottom:12px;font:var(--t8s)/1.4 var(--title)}
/* терминал */
.term{font-family:var(--body);background:#020503;color:var(--phos);min-height:260px;padding:12px;line-height:1.3;white-space:pre-wrap;word-break:break-word}
.term .in{display:flex;gap:6px}
.term input{flex:1;min-width:0;background:none;border:0;color:var(--hi);font:inherit;padding:0;outline:none;caret-color:var(--phos)}
.term .hl{color:var(--hi)}
.term .er{color:var(--accent)}
/* прогресс */
.bar{height:24px;border:2px solid var(--phos);padding:2px;margin:8px 0 12px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--phos) 0 12px,transparent 12px 16px);width:0}
/* календарь */
.cal{border-collapse:collapse;width:100%;text-align:center}
.cal th{font:var(--t8s)/2 var(--title);color:var(--mid)}
.cal td{border:2px solid var(--dim);padding:6px 0}
.cal td.today{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal td.off{border-color:transparent}
canvas.screen{display:block;width:100%;height:auto;background:#000}
/* панель задач */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb);z-index:60;display:flex;align-items:center;gap:6px;
  padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left));
  background:var(--panel);border-top:2px solid var(--phos);transform:translateY(110%)}
#taskbar.up{transform:none;transition:transform .3s steps(3)}
#start{background:var(--phos);color:var(--bg);border:0;font:var(--t8s)/1 var(--title);padding:8px 10px;cursor:pointer;flex:none}
#start[aria-expanded=true]{background:var(--hi)}
#tasks{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.task{font:var(--t8s)/1 var(--title);border:2px solid var(--dim);background:none;padding:6px 8px;cursor:pointer;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.task.act{border-color:var(--phos);background:var(--dim);color:var(--hi)}
#snd{font:var(--t8s)/1 var(--title);background:none;border:2px solid var(--dim);padding:6px;cursor:pointer;flex:none}
#clock{font:var(--t8s)/1 var(--title);color:var(--phos);flex:none;padding:0 4px}
#menu{position:absolute;left:max(6px,env(safe-area-inset-left));bottom:calc(var(--tb) - 2px);z-index:70;background:var(--panel);border:2px solid var(--phos);box-shadow:6px 6px 0 #000;min-width:220px;padding:4px 0}
#menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;font:var(--t8s)/1.2 var(--title)}
#menu button:hover,#menu button:focus-visible{background:var(--phos);color:var(--bg);outline:none}
#menu hr{border:0;border-top:2px solid var(--dim);margin:4px 0}
#menu .mi{width:16px;height:16px;flex:none;background:url(assets/icons.png) no-repeat;background-size:192px 16px}
#flash{position:fixed;inset:0;background:var(--accent);mix-blend-mode:multiply;opacity:0;pointer-events:none;z-index:85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* узкий / вертикальный экран: комната сверху, иконки снизу */
@media (max-aspect-ratio:4/5),(max-width:640px){
  #desk{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:center;gap:12px;padding-top:max(12px,env(safe-area-inset-top))}
  #desk .icons{grid-template-columns:repeat(4,calc((100vw - 32px) / 4));gap:8px 0}
  #iconsL{order:2} #roomwin{order:1} #iconsR{display:none}
  .icon .lb{white-space:nowrap;overflow-wrap:normal;max-width:none;padding:2px}
  :root{--t8:8px;--txt:16px}
  .win .body{padding:12px}
  .task{max-width:110px}
}
@media (prefers-reduced-motion:reduce){
  .icon.show,#hint.on,.tbar .dot.blink,#fx.flick{animation:none}
  #taskbar.up{transition:none}
}
</style>
</head>
<body>

<!-- ЭКРАН 1 -->
<div id="scene" aria-label="Ретро-компьютер в комнате. Нажми на экран, чтобы войти.">
  <img id="backdrop" src="assets/monitor.jpg" alt="" draggable="false">
  <canvas id="crt" class="px"></canvas>
  <div id="paint"><img id="photo" src="assets/monitor.webp" alt="Ретро-ЭЛТ-монитор на столе" draggable="false"></div>
  <div id="glow"></div>
</div>
<div id="hint" role="button" tabindex="0">&gt; НАЖМИ НА ЭКРАН<b>_</b></div>
<div class="corner r" id="corner"><button class="chip" id="skip" type="button">ПРОПУСТИТЬ</button><button class="chip" id="snd0" type="button">ЗВУК: ВКЛ</button></div>

<!-- ЭКРАН 2 -->
<div id="os" aria-hidden="true">
  <div id="desk">
    <nav class="icons" id="iconsL" aria-label="Иконки"></nav>
    <div id="roomwin">
      <div class="tbar"><span class="dot blink"></span><span class="tt">BANY.EXE — КОМНАТА</span><span>LIVE</span></div>
      <div id="roomwrap"><canvas id="room" width="1024" height="1024" aria-label="Пиксельная комната: я за столом, спиной к камере"></canvas></div>
    </div>
    <nav class="icons" id="iconsR" aria-label="Приложения"></nav>
  </div>
  <div id="wins"></div>
  <div id="menu" hidden role="menu"></div>
  <div id="taskbar">
    <button id="start" type="button" aria-haspopup="true" aria-expanded="false">ПУСК</button>
    <div id="tasks"></div>
    <button id="snd" type="button" aria-label="Звук">ЗВУК</button>
    <span id="clock">--:--</span>
  </div>
</div>
<div id="flash"></div>
<div id="fx"></div>

<script>
/* =====================================================================
   CONFIG — всё, что стоит править, лежит здесь.
   Координаты «в пикселях картинки» — это пиксели исходного файла
   (monitor.jpg и room.png оба 1024x1024).
   ===================================================================== */
const CONFIG = {
  // Палитра ОС: 9 цветов интерфейса + цвета экранов в комнате (см. room.screens). Один тёплый акцент — красный неон.
  colors: {
    bg:'#050a07',      // почти чёрный фон
    panel:'#0b1a10',   // панели
    dim:'#1d5a2a',     // тёмно-зелёный (рамки, неактивное)
    mid:'#2f8a3e',     // средний зелёный
    phos:'#7fe08a',    // фосфор — основной
    hi:'#c8ffc8',      // яркий фосфор — выделения
    accent:'#ff3b5c',  // красный неон — единственный тёплый акцент
    accentDim:'#4a0f1c',
    black:'#000000'
  },

  // Тайминги, мс. fps — частота покадровых анимаций (комната, дождь), по ТЗ 8–12.
  timing: {
    boot: 600,         // тёмный экран с курсором до начала дождя
    rain: 3000,        // сколько скатывается код
    collapse: 260,     // сжатие изображения в линию
    line: 220,         // яркая линия ЭЛТ
    unfold: 520,       // раскрытие в комнату
    dive: 1700,        // падение камеры в монитор
    zoomOut: 1500,     // отъезд от комнаты до рабочего стола
    iconStagger: 70,   // задержка между появлением иконок
    fps: 10,           // анимации в комнате
    rainFps: 12        // код-дождь
  },

  // Фото монитора. glass — углы стекла (ЛВ, ПВ, ПН, ЛН) в пикселях фото; safe — область, которая
  // всегда должна быть видна целиком (монитор + клавиатура), остальное может уйти за край.
  // Если меняешь фото: положи monitor.jpg и запусти tools/key_monitor.py — он вырежет хромакей
  // в monitor.webp и подскажет углы.
  monitor: {
    photo: 'assets/monitor.webp',
    glass: [[262,301],[745,298],[753,636],[253,635]],
    safe: [220, 260, 800, 910]
  },

  // Экран ЭЛТ: реальное разрешение в «пикселях» (картинка растягивается чётко, без размытия).
  // crop — какая часть комнаты видна на мониторе: [x, y, w, h] в пикселях room.png (пропорции ≈ w/h экрана).
  crt: { w: 256, h: 174, crop: [0, 168, 1024, 696] },

  // Комната (твоя сцена). Экраны оживают только там, где маска room-screens.png (её делает tools/make_masks.py).
  // rect — [x, y, w, h] в пикселях room.png; kind — что показывать; colors — палитра экрана.
  room: {
    src: 'assets/room.png',
    screensMask: 'assets/room-screens.png',
    twinkleMask: 'assets/room-twinkle.png',   // диоды и огни за окном
    twinkle: 0.14,                             // доля «погасших» огоньков в каждом кадре
    screens: [
      { kind:'log',   rect:[20, 80, 212, 148],  colors:['#3a0c1c','#b02c4a','#ff7d92','#ffe8ee'] },
      { kind:'bars',  rect:[364,102,124, 76],   colors:['#09121c','#e8923a','#d04a4a','#4ab8d8','#6fe0a0'] },
      { kind:'code',  rect:[300,376,368,206],   colors:['#bfe8e4','#7cb9bc','#3f7f88','#ff5a6e'] },
      { kind:'graph', rect:[796,546,156, 80],   colors:['#04070b','#e8d04a','#6fe0a0','#4ab8d8','#e05050'] }
    ]
  },

  // Звук синтезируется прямо в браузере (WebAudio), файлов нет. Включается после первого клика.
  sound: { enabled: true, volume: 0.22, hum: true },

  // Иконки рабочего стола. icon — номер картинки в assets/icons.png (слева направо, с нуля):
  // 0 человек, 1 папка, 2 почта, 3 терминал, 4 глобус, 5 музыка, 6 камера, 7 календарь, 8 корзина, 9 вирус, 10 загрузка, 11 документ
  icons: [
    { id:'about',    label:'ОБО МНЕ',    icon:0,  side:'left'  },
    { id:'projects', label:'ПРОЕКТЫ',    icon:1,  side:'left'  },
    { id:'mail',     label:'ПОЧТА',      icon:2,  side:'left'  },
    { id:'terminal', label:'ТЕРМИНАЛ',   icon:3,  side:'left'  },
    { id:'web',      label:'ИНТЕРНЕТ',   icon:4,  side:'left'  },
    { id:'downloads',label:'ЗАГРУЗКИ',   icon:10, side:'left'  },
    { id:'music',    label:'МУЗЫКА',     icon:5,  side:'right' },
    { id:'camera',   label:'КАМЕРА',     icon:6,  side:'right' },

  const pc = G.reduce((a,p) => [a[0]+p[0]/4, a[1]+p[1]/4], [0,0]), qc = Q.reduce((a,p) => [a[0]+p[0]/4, a[1]+p[1]/4], [0,0]);
  paint.style.transform = `translate(${qc[0]-pc[0]*k}px,${qc[1]-pc[1]*k}px) scale(${k})`;
  crt.style.transform = homography(CW, CH_, Q);
  glow.style.transform = `translate(${(qc[0] - (Qv0[0][0]+Qv0[2][0])/2)}px,${(qc[1] - (Qv0[0][1]+Qv0[2][1])/2)}px) scale(${w1/w0})`;
}

// Код-дождь: колонки символов 3x5 в ячейках 4x6, скатываются сверху вниз
const RC = CW/4|0, RR = CH_/6|0, GL = [C.colors.hi, C.colors.phos, C.colors.mid, C.colors.dim, '#0f2a16'];
const cols = Array.from({length:RC}, (_,c) => ({d: rnd(c)*900, v: 9 + rnd(c+99)*16, L: 5 + rnd(c+7)*14}));
function drawRain(ms){
  const t = Math.floor(ms/1000*T.rainFps)/T.rainFps*1000;   // время квантуется под rainFps
  rx.fillStyle = '#020503'; rx.fillRect(0,0,CW,CH_);
  for(let c=0;c<RC;c++){ const ci = cols[c], head = (t - ci.d)*ci.v/1000; if(head < 0) continue;
    for(let r=0;r<RR;r++){ const d = head - r; if(d < 0) break;
      const lv = d < 1 ? 0 : d < 2 ? 1 : d < ci.L*.5 ? 2 : d < ci.L ? 3 : 4;
      if(lv === 4 && rnd(c*13 + r*7) > .55) continue;
      const ch = CH[Math.floor(rnd(c*31 + r*7 + Math.floor(t/(d < 3 ? 80 : 600)))*CH.length)];
      glyph(rx, ch, c*4, r*6 + 1, GL[lv]); } }
}
// копия lo → видимый canvas ×2 + скан-линии
function present(){
  cx.imageSmoothingEnabled = false; cx.drawImage(lo, 0, 0, CW*2, CH_*2);
  cx.fillStyle = 'rgba(0,0,0,.28)'; for(let y=1;y<CH_*2;y+=2) cx.fillRect(0, y, CW*2, 1);
}
function drawRoomOnCrt(hFrac){
  lx.fillStyle = '#000'; lx.fillRect(0,0,CW,CH_);
  const h = Math.max(1, Math.round(CH_*hFrac)), y = Math.round((CH_-h)/2);
  lx.imageSmoothingEnabled = true; lx.imageSmoothingQuality = 'high';
  const sh = CROP[3]*hFrac, sy = CROP[1] + (CROP[3]-sh)/2;
  if(roomReady) lx.drawImage(roomC, CROP[0], sy, CROP[2], sh, 0, y, CW, h);
  if(hFrac < 1){ lx.fillStyle = C.colors.hi; lx.fillRect(0, y, CW, 1); lx.fillRect(0, y+h-1, CW, 1); }
}

let state = 'boot', t0 = performance.now(), lastCrt = -1;
function crtFrame(now){
  const el = now - t0, a = T.boot, b = a + T.rain, c = b + T.collapse, d = c + T.line, e = d + T.unfold;
  if(state === 'boot' || state === 'rain'){
    if(reduced || el >= e){ toReady(); }
    else if(el < a){ lx.fillStyle = '#020503'; lx.fillRect(0,0,CW,CH_); if(Math.floor(el/250)%2) text(lx, '_', 4, 4, C.colors.phos); text(lx, 'BANY OS', 4, CH_-10, C.colors.dim); }
    else if(el < b){ if(state === 'boot'){ state = 'rain'; SFX.power(); } drawRain(el - a); lx.drawImage(rain, 0, 0); }
    else if(el < c){ const u = Math.floor((el-b)/T.collapse*6)/6, h = Math.max(2, Math.round(CH_*(1-u)*(1-u)));
      lx.fillStyle = '#000'; lx.fillRect(0,0,CW,CH_); lx.imageSmoothingEnabled = false; lx.drawImage(rain, 0, 0, CW, CH_, 0, Math.round((CH_-h)/2), CW, h); }
    else if(el < d){ lx.fillStyle = '#000'; lx.fillRect(0,0,CW,CH_); const w = Math.round(CW*(1 - (el-c)/T.line*.15));
      lx.fillStyle = C.colors.hi; lx.fillRect((CW-w)>>1, (CH_>>1) - 1, w, 2); }
    else { const u = Math.floor((el-d)/T.unfold*10)/10; drawRoomOnCrt(Math.max(.02, 1-(1-u)*(1-u))); }
    present();
    glow.style.opacity = state === 'rain' ? .55 : .35;
  } else if(state === 'ready' || state === 'dive' || state === 'surf'){
    if(roomStep !== lastCrt){ lastCrt = roomStep; drawRoomOnCrt(1); present(); }
    glow.style.opacity = .5;
  }
}
function toReady(){ state = 'ready'; hint.classList.add('on'); $('skip').hidden = true; lastCrt = -1; }
function skipIntro(){ if(state === 'boot' || state === 'rain'){ toReady(); } }
$('skip').addEventListener('click', e => { e.stopPropagation(); skipIntro(); });

function inQuad(x, y){ const q = curQ; if(!q) return false; let s = 0;
  for(let i=0;i<4;i++){ const a = q[i], b = q[(i+1)%4], cr = (b[0]-a[0])*(y-a[1]) - (b[1]-a[1])*(x-a[0]); const sg = cr > 0 ? 1 : -1; if(i === 0) s = sg; else if(sg !== s) return false; } return true; }
scene.addEventListener('click', e => {

const os = $('os'), desk = $('desk'), roomwin = $('roomwin'), roomwrap = $('roomwrap'), taskbar = $('taskbar'), fx = $('fx');
let osE = 0;

// Размеры: иконки — целый масштаб пикселей (32 → 64/96/... физических пикселей), комната — без обрезки
function layoutOS(){
  const dpr = window.devicePixelRatio || 1, narrow = matchMedia('(max-aspect-ratio:4/5),(max-width:640px)').matches;
  const icoTarget = narrow ? Math.min(48, (vw - 32)/4 - 24) : (vh < 700 ? 48 : 64);
  const icoDev = Math.max(1, Math.floor(icoTarget*dpr/32))*32;            // кратно 32 физическим пикселям
  const ico = icoDev/dpr; root.style.setProperty('--ico', ico + 'px');
  const tb = parseFloat(getComputedStyle(root).getPropertyValue('--tb')) || 40;
  let D;
  if(narrow){ const rowsH = 3*(ico + 40) + 16; D = Math.min(vw - 32, vh - tb - rowsH - 24 - 48); }
  else { D = Math.min(vh - tb - 24 - 40, vw - 2*(2*(ico + 40) + 8) - 64); }
  D = Math.max(160, D);
  // если комнату можно показать 1:1 или крупнее — берём целый множитель физических пикселей
  const dev = D*dpr; D = (dev >= RS ? Math.floor(dev/RS)*RS : Math.floor(dev))/dpr;
  root.style.setProperty('--room', D + 'px');
  // на телефоне все иконки в одну сетку 4×3, на десктопе — по бокам от комнаты
  iconEls.forEach((el, i) => { const p = $(narrow || C.icons[i].side === 'left' ? 'iconsL' : 'iconsR'); if(el.parentNode !== p) p.appendChild(el); });
  roomC.classList.toggle('px', D*dpr >= RS);   // увеличение — чёткие пиксели, уменьшение — сглаживание
}

function prepOS(e){
  osE = e; const ee = ease(e);
  roomC.style.transform = 'none';
  const R = roomwrap.getBoundingClientRect(), f = R.width/RS;
  const pc = [(CROP[0] + CROP[2]/2)*f, (CROP[1] + CROP[3]/2)*f];
  const qw = Qend[1][0] - Qend[0][0], m = qw/(CROP[2]*f);       // такой же кадр, каким был экран в конце падения
  const qc = [vw/2, vh/2], c1 = [R.left + pc[0], R.top + pc[1]];
  const s = Math.pow(m, 1 - ee), T_ = [lerp(qc[0], c1[0], ee), lerp(qc[1], c1[1], ee)];
  roomC.style.transform = ee >= 1 ? 'none' : `translate(${T_[0] - R.left - s*pc[0]}px,${T_[1] - R.top - s*pc[1]}px) scale(${s})`;
  roomwin.classList.toggle('frame', ee > .85);
  roomwrap.style.overflow = ee >= 1 ? 'hidden' : 'visible';
  taskbar.classList.toggle('up', ee > .7);
  if(ee > .6) showIcons(); else hideIcons();
}
const iconEls = [];
let iconsShown = false;
function showIcons(){ if(iconsShown) return; iconsShown = true;
  iconEls.forEach((el, i) => { if(reduced) el.classList.add('show'); else el._t = setTimeout(() => el.classList.add('show'), i*T.iconStagger); }); }
function hideIcons(){ if(!iconsShown) return; iconsShown = false; iconEls.forEach(el => { clearTimeout(el._t); el.classList.remove('show'); }); }

function startDive(){
  if(state !== 'ready') return;
  hint.classList.remove('on'); scene.classList.remove('hot'); SFX.dive();
  if(reduced){ dive = 1; applyCamera(); enterOS(); osE = 1; prepOS(1); state = 'inside'; return; }
  state = 'dive';
}
function enterOS(){
  layoutOS(); os.classList.add('on'); os.setAttribute('aria-hidden', 'false');
  scene.style.visibility = 'hidden'; hint.style.visibility = 'hidden'; $('corner').hidden = true;
  fx.classList.toggle('flick', !reduced); SFX.hum(true);
}
function leaveOS(){
  if(state !== 'inside') return;
  closeAll(); closeMenu(); SFX.close(); SFX.hum(false);
  if(reduced){ exitToScene(); dive = 0; applyCamera(); toReady(); return; }
  state = 'osout';
}
function exitToScene(){
  os.classList.remove('on'); os.setAttribute('aria-hidden', 'true'); taskbar.classList.remove('up'); hideIcons(); roomwin.classList.remove('frame');
  scene.style.visibility = 'visible'; hint.style.visibility = 'visible'; $('corner').hidden = false; fx.classList.remove('flick');
}

/* ---------------- окна ---------------- */
const winsEl = $('wins'), tasksEl = $('tasks');
const open = {}; let z = 10, cascade = 0;
function focusWin(id){ if(!open[id]) return; open[id].el.style.zIndex = ++z;
  Object.keys(open).forEach(k => { open[k].el.classList.toggle('inactive', k !== id); open[k].task.classList.toggle('act', k === id); }); }
function openWin(id){
  if(open[id]){ focusWin(id); return; }
  const cfg = C.windows[id]; if(!cfg) return;
  const el = document.createElement('section'); el.className = 'win'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', cfg.title);
  el.innerHTML = '<div class="tbar"><span class="tt"></span><button class="x" type="button" aria-label="Закрыть">X</button></div><div class="body"></div>';
  el.querySelector('.tt').textContent = cfg.title;
  const body = el.querySelector('.body');
  const narrow = innerWidth < 640, W = Math.round(narrow ? innerWidth - 16 : Math.min(cfg.w, innerWidth - 32));
  el.style.width = W + 'px';
  const H = innerHeight - parseFloat(getComputedStyle(root).getPropertyValue('--tb'));
  body.style.maxHeight = (H - (narrow ? 48 : 96)) + 'px';
  const cleanup = (APPS[cfg.type] || APPS.html)(body, cfg, id) || null;
  winsEl.appendChild(el);
  const off = (cascade++ % 6)*24;
  const left = narrow ? 8 : Math.round(clamp(innerWidth/2 - W/2 + off - 60, 8, innerWidth - W - 8));
  const top = narrow ? 8 + (cascade % 3)*8 : Math.round(clamp(40 + off, 8, H - 120));
  el.style.left = left + 'px'; el.style.top = top + 'px';
  const task = document.createElement('button'); task.type = 'button'; task.className = 'task'; task.textContent = cfg.title;
  task.addEventListener('click', () => { SFX.click(); focusWin(id); }); tasksEl.appendChild(task);
  open[id] = {el, task, cleanup};
  el.addEventListener('pointerdown', () => focusWin(id));
  el.querySelector('.x').addEventListener('click', e => { e.stopPropagation(); closeWin(id); });
  dragify(el, el.querySelector('.tbar'));
  focusWin(id); SFX.open();
  if(cfg.effect === 'glitch') glitch();
}
function closeWin(id){ const w = open[id]; if(!w) return; if(w.cleanup) w.cleanup(); w.el.remove(); w.task.remove(); delete open[id]; SFX.close();
  const rest = Object.keys(open); if(rest.length) focusWin(rest.reduce((a,b) => +open[a].el.style.zIndex > +open[b].el.style.zIndex ? a : b)); }
function closeAll(){ Object.keys(open).forEach(id => { const w = open[id]; if(w.cleanup) w.cleanup(); w.el.remove(); w.task.remove(); delete open[id]; }); }
function dragify(el, handle){
  let sx, sy, ox, oy, on = false;
  handle.addEventListener('pointerdown', e => { if(e.target.closest('.x')) return; on = true; sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; handle.setPointerCapture(e.pointerId); e.preventDefault(); });
  handle.addEventListener('pointermove', e => { if(!on) return;
    // только целые пиксели
    el.style.left = Math.round(clamp(ox + e.clientX - sx, 60 - el.offsetWidth, innerWidth - 60)) + 'px';
    el.style.top = Math.round(clamp(oy + e.clientY - sy, 0, innerHeight - 80)) + 'px'; });
  const end = () => { on = false; }; handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
}
winsEl.addEventListener('click', e => { const a = e.target.closest('[data-open]'); if(a){ e.preventDefault(); openWin(a.dataset.open); } });

function glitch(){
  SFX.error(); if(reduced) return;
  const fl = $('flash'); let n = 0;
  const iv = setInterval(() => { n++;
    os.style.transform = n < 8 ? `translate(${Math.round((rnd(n*3.3)-.5)*16)}px,${Math.round((rnd(n*7.7)-.5)*10)}px)` : '';
    fl.style.opacity = n < 8 && n % 2 ? .55 : 0;
    if(n >= 8) clearInterval(iv); }, 1000/12);
}

const APPS = {
  html(body, cfg){ body.innerHTML = cfg.html;
    body.querySelectorAll('canvas[data-avatar]').forEach(cv => loadImg(cv.dataset.avatar).then(im => { if(!im) return; const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high';
      const s = Math.min(im.width, im.height); x.drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, cv.width, cv.height); })); },

  img(body, cfg){ body.classList.add('flush'); const im = new Image(); im.src = cfg.src; im.alt = cfg.title; im.draggable = false; body.appendChild(im);
    if(cfg.caption){ const p = document.createElement('p'); p.textContent = cfg.caption; p.style.cssText = 'padding:12px 16px;margin:0;line-height:1.35'; body.appendChild(p); } },

  terminal(body){
    body.classList.add('flush'); const t = document.createElement('div'); t.className = 'term'; body.appendChild(t);
    const out = document.createElement('div'), line = document.createElement('label'); line.className = 'in';
    line.innerHTML = '<span></span><input autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Команда">';
    line.querySelector('span').textContent = C.terminal.prompt; t.append(out, line);
    const inp = line.querySelector('input'), hist = []; let hi = 0;
    const print = (s, cls) => { const d = document.createElement('div'); if(cls) d.className = cls; d.textContent = s; out.appendChild(d); body.scrollTop = body.scrollHeight; };
    const cmds = Object.assign({
      help: () => 'Команды: ' + Object.keys(cmds).sort().join(', ') + '\nopen <окно>: ' + Object.keys(C.windows).join(', '),
      date: () => new Date().toLocaleString('ru-RU'),
      clear: () => { out.textContent = ''; return null; },
      open: a => C.windows[a] ? (openWin(a), 'Запускаю ' + a + '...') : 'Нет такого окна. Варианты: ' + Object.keys(C.windows).join(', '),
      exit: () => { setTimeout(leaveOS, 300); return 'Выключение...'; }
    }, C.terminal.commands);
    print(C.terminal.greeting);
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ const v = inp.value.trim(); inp.value = ''; print(C.terminal.prompt + ' ' + v, 'hl'); if(!v) return; hist.push(v); hi = hist.length; SFX.click();
        const [c, ...args] = v.split(/\s+/), f = cmds[c.toLowerCase()];
        if(f === undefined){ print('Неизвестная команда: ' + c + '. Введи help.', 'er'); SFX.error(); return; }
        const r = typeof f === 'function' ? f(args.join(' ')) : f; if(r != null) print(r); }
      else if(e.key === 'ArrowUp'){ hi = Math.max(0, hi-1); inp.value = hist[hi] || ''; e.preventDefault(); }
      else if(e.key === 'ArrowDown'){ hi = Math.min(hist.length, hi+1); inp.value = hist[hi] || ''; e.preventDefault(); }
      else if(e.key.length === 1) SFX.tone(1800 + Math.random()*400, .015, 'square', .05);
    });
    t.addEventListener('click', () => inp.focus());
    if(matchMedia('(pointer:fine)').matches) setTimeout(() => inp.focus(), 50);
  },

  music(body){
    body.innerHTML = '<canvas class="screen px" width="128" height="40"></canvas><p style="margin:12px 0 4px">TRACK 01 — <span class="muted">BANY_THEME.MOD</span></p><button class="btn" type="button">▶ ИГРАТЬ</button>';
    const cv = body.querySelector('canvas'), x = cv.getContext('2d'), btn = body.querySelector('button');
    // простая чиптюн-петля: [нота в полутонах от A4, длительность в шагах]
    const MEL = [0,3,7,12, 10,7,3,7, -2,2,5,10, 8,5,2,5], BASS = [-24,-24,-26,-26];
    let playing = false, timer = null, step = 0, an = null, bars = new Array(16).fill(0), viz = null;
    const hz = n => 440*Math.pow(2, n/12);
    function tick(){ if(!SFX.ctx) return; const n = MEL[step % 16]; SFX.tone(hz(n), .16, 'square', .09); if(step % 4 === 0) SFX.tone(hz(BASS[(step/4|0) % 4]), .4, 'triangle', .2);
      bars = bars.map((b,i) => Math.max(b - 2, (i === (n + 12) % 16 ? 10 : 0) + Math.floor(rnd(step*16 + i)*4))); step++; }
    function draw(){ x.fillStyle = '#020503'; x.fillRect(0,0,128,40);
      bars.forEach((b,i) => { for(let k=0;k<b;k++){ x.fillStyle = k > 8 ? C.colors.accent : k > 5 ? C.colors.hi : C.colors.phos; x.fillRect(4 + i*7 + 1, 34 - k*3, 5, 2); } });
      x.fillStyle = C.colors.dim; x.fillRect(0, 37, 128, 1); }

      clearInterval(timer); clearInterval(viz);
      if(playing){ timer = setInterval(tick, 150); viz = setInterval(draw, 100); } else { bars.fill(0); draw(); } });
    return () => { clearInterval(timer); clearInterval(viz); };
  },

  camera(body){

    const cv = body.querySelector('canvas'), x = cv.getContext('2d');
    const draw = () => { x.imageSmoothingEnabled = true; x.drawImage(roomC, 112, 120, 800, 600, 0, 0, 160, 120);
      x.fillStyle = 'rgba(0,0,0,.25)'; for(let y=0;y<120;y+=2) x.fillRect(0, y, 160, 1);

      if(Math.floor(Date.now()/500) % 2){ x.fillStyle = C.colors.accent; x.fillRect(4, 4, 4, 4); }

  calendar(body){

    const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m+1, 0).getDate();

    for(let i=0;i<first;i++) h += '<td class="off"></td>';

    body.innerHTML = h + '</tr></table><p class="muted" style="margin-top:12px">Свободен для созвонов — пиши в почту.</p>';

        a.addEventListener('click', e => { e.preventDefault(); const k = 'file:' + name; if(!C.windows[k]) C.windows[k] = {title:name, w:520, type:'img', src}; openWin(k); });
        li.innerHTML = '<b>ФАЙЛ</b>'; li.appendChild(a); ul.appendChild(li); }); };

  menu.innerHTML = '';
  ['about','projects','mail','terminal','readme'].forEach(id => { const ic = C.icons.find(i => i.id === id); if(!ic) return;
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem');
    b.innerHTML = `<span class="mi px" style="background-position:${-ic.icon*16}px 0"></span><span></span>`; b.lastChild.textContent = ic.label;
    b.addEventListener('click', () => { closeMenu(); openWin(id); }); menu.appendChild(b); });
  menu.appendChild(document.createElement('hr'));
  const off = document.createElement('button'); off.type = 'button'; off.setAttribute('role', 'menuitem'); off.textContent = 'ВЫКЛЮЧИТЬ';
  off.addEventListener('click', () => { closeMenu(); leaveOS(); }); menu.appendChild(off);
}
function closeMenu(){ menu.hidden = true; startBtn.setAttribute('aria-expanded', 'false'); }
startBtn.addEventListener('click', e => { e.stopPropagation(); SFX.click(); if(menu.hidden){ buildMenu(); menu.hidden = false; startBtn.setAttribute('aria-expanded', 'true'); menu.querySelector('button').focus(); } else closeMenu(); });
document.addEventListener('pointerdown', e => { if(!menu.hidden && !menu.contains(e.target) && e.target !== startBtn) closeMenu(); });

/* ---------------- часы ---------------- */
function tickClock(){ const d = new Date(), sep = reduced || d.getSeconds() % 2 ? ':' : ' ';
  $('clock').textContent = String(d.getHours()).padStart(2,'0') + sep + String(d.getMinutes()).padStart(2,'0'); }
setInterval(tickClock, 1000); tickClock();

/* ---------------- клавиатура ---------------- */
addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(!menu.hidden) return closeMenu(); const ids = Object.keys(open); if(ids.length){ closeWin(ids.reduce((a,b) => +open[a].el.style.zIndex > +open[b].el.style.zIndex ? a : b)); } return; }
  if((e.key === 'Enter' || e.key === ' ') && (state === 'ready' || state === 'boot' || state === 'rain') && !e.target.closest('button')){ e.preventDefault(); state === 'ready' ? startDive() : skipIntro(); }
});

/* ---------------- главный цикл ---------------- */
let prev = performance.now();
function loop(now){
  const dt = Math.min(64, now - prev); prev = now;
  renderRoom(now);
  if(state !== 'inside' && state !== 'osin' && state !== 'osout') crtFrame(now);
  if(state === 'dive'){ dive = Math.min(1, dive + dt/T.dive); applyCamera();
    if(dive >= 1){ state = 'osin'; enterOS(); prepOS(0); } }
  else if(state === 'osin'){ prepOS(Math.min(1, osE + dt/T.zoomOut)); if(osE >= 1) state = 'inside'; }
  else if(state === 'osout'){ prepOS(Math.max(0, osE - dt/T.zoomOut)); if(osE <= 0){ exitToScene(); state = 'surf'; dive = 1; lastCrt = -1; } }
  else if(state === 'surf'){ dive = Math.max(0, dive - dt/T.dive); applyCamera(); if(dive <= 0) toReady(); }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { layoutScene(); if(os.classList.contains('on')){ layoutOS(); prepOS(osE); } });
layoutScene(); SFX.set(SFX.on); requestAnimationFrame(loop);

// для отладки из консоли: BANY.open('about'), BANY.skip()
window.BANY = { open: openWin, skip: () => { skipIntro(); startDive(); }, config: C };
})();
</script>
